[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccv"
version = "0.1.0"
description = "Cox Code Vulnerability — centralized Veracode SAST workflow with AI enrichment"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
