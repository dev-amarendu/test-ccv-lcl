[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccv-analysis-agent"
version = "0.2.0"
description = "CCV Analysis Agent — LLM analysis of findings via Google ADK + Vertex AI"
requires-python = ">=3.11"
dependencies = [
    "ccv-shared",
    "google-adk",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["analysis_agent"]
