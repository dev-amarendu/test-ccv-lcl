[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccv-shared"
version = "0.1.0"
description = "CCV shared library — config, Firestore, Pub/Sub, logging"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-firestore>=2.16",
    "google-cloud-pubsub>=2.21",
    "google-cloud-aiplatform>=1.50",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["shared"]
