[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccv-scan-runner"
version = "0.1.0"
description = "CCV Scan Runner — orchestrates Veracode scans via MCP tools"
requires-python = ">=3.11"
dependencies = [
    "ccv-shared",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["scan_runner"]
