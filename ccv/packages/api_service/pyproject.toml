[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccv-api-service"
version = "0.1.0"
description = "CCV API Service — FastAPI REST endpoints"
requires-python = ">=3.11"
dependencies = [
    "ccv-shared",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["api_service"]
