[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccv-mcp-server"
version = "0.1.0"
description = "CCV MCP Server — stateless tool gateway"
requires-python = ">=3.11"
dependencies = [
    "ccv-shared",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "veracode-api-signing>=24.0",
    "defusedxml>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
